name: Recruitment Email Sync

on:
  schedule:
    # 每天北京时间 07:00 ~ 23:45 每 15 分钟自动运行一次
    # UTC 23:00 对应次日北京时间 07:00；UTC 00:00 ~ 15:45 对应北京时间 08:00 ~ 23:45
    - cron: '*/15 0-15,23 * * *'
    # 每天北京时间 00:00 再执行当天最后一轮 (UTC 16:00)
    - cron: '0 16 * * *'
  # 支持在 GitHub 网页上手动点击 "Run workflow" 一键触发测试
  workflow_dispatch:

jobs:
  sync-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 openai httpx

      - name: Run Cloud Sync Worker
        env:
          # 🔒 核心机密 (从 GitHub Secrets 显式注入)
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # ⚙️ 服务参数 (支持通过 GitHub Secrets 或 Variables 注入，未指定时由 Python 自动回退)
          IMAP_SERVER: ${{ secrets.IMAP_SERVER || vars.IMAP_SERVER }}
          DEEPSEEK_API_BASE: ${{ secrets.DEEPSEEK_API_BASE || vars.DEEPSEEK_API_BASE }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || vars.DEEPSEEK_MODEL }}
        run: |
          python cloud/worker.py
