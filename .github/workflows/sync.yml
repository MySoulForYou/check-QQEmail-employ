name: Recruitment Email Sync

on:
  schedule:
    # UTC 23:03~23:58 (次日北京 07:03~07:58) & UTC 00:03~15:58 (北京 08:03~23:58)
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 0-15,23 * * *'
    # 每天北京时间 00:00 再执行当天最后一轮（UTC 16:00）。
    - cron: '0 16 * * *'
  # 支持在 GitHub 网页上手动点击 "Run workflow" 一键触发测试
  workflow_dispatch:

# 如果某次同步因排队尚未结束，后续触发会等待，避免多个同步任务并发处理同一批邮件。
concurrency:
  group: recruitment-email-sync
  cancel-in-progress: false

jobs:
  sync-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 openai httpx

      - name: Run Cloud Sync Worker
        env:
          # 🔒 核心机密 (从 GitHub Secrets 显式注入)
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # ⚙️ 服务参数 (支持通过 GitHub Secrets 或 Variables 注入，未指定时由 Python 自动回退)
          IMAP_SERVER: ${{ secrets.IMAP_SERVER || vars.IMAP_SERVER }}
          DEEPSEEK_API_BASE: ${{ secrets.DEEPSEEK_API_BASE || vars.DEEPSEEK_API_BASE }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || vars.DEEPSEEK_MODEL }}
        run: |
          python cloud/worker.py
